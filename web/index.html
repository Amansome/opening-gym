<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0e" />
    <meta
      name="description"
      content="Free, open-source chess opening trainer. Learn each line move by move with plain-English explanations, then drill it with spaced repetition."
    />
    <title>Opening Gym: free chess opening trainer</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Dark is the default.
      try {
        var t = localStorage.getItem("opening-gym:theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
